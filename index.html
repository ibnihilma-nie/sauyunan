                                    <div className="text-3xl text-blue-500 mb-2"><i className="fa-solid fa-lightbulb"></i></div>
                                    <div className="text-xs font-bold text-gray-800">Pembelajar</div>
                                </div>
                            </div>
                        </Card>

                        <Card className="p-6">
                            <h2 className="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wider">Rekomendasi Berikutnya</h2>
                            <div className="flex items-start gap-3 p-3 bg-blue-50 rounded-xl text-blue-800 border border-blue-100 cursor-pointer hover:bg-blue-100 transition-colors">
                                <i className="fa-solid fa-comments mt-1"></i>
                                <div>
                                    <div className="font-bold text-sm">Modul: Musyawarah</div>
                                    <div className="text-xs opacity-80 mt-1">Lanjutkan modul yang tertunda.</div>
                                </div>
                            </div>
                        </Card>
                    </div>
                </div>
                <ChatBuddy />
            </div>
        );

        const DashboardGuru = () => (
            <div className="fade-in max-w-7xl mx-auto px-6 py-10">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h1 className="text-3xl font-extrabold text-earth-dark">Dashboard Guru</h1>
                        <p className="text-gray-600">Pantau dan petakan kebutuhan belajar siswa Anda.</p>
                    </div>
                    <Button variant="primary"><i className="fa-solid fa-file-export"></i> Export Laporan</Button>
                </div>

                <div className="grid lg:grid-cols-4 gap-6 mb-8">
                    {[{t:"Total Siswa", v:"32", i:"fa-users", c:"text-blue-500 bg-blue-50"},
                      {t:"Rata-rata Progress", v:"68%", i:"fa-chart-line", c:"text-leaf bg-leaf/10"},
                      {t:"Project Selesai", v:"4", i:"fa-check-double", c:"text-green-500 bg-green-50"},
                      {t:"Butuh Pendampingan", v:"3", i:"fa-hand-holding-hand", c:"text-orange-500 bg-orange-50"}].map((s,i)=>(
                        <Card key={i} className="p-6 flex items-center gap-4">
                            <div className={`w-12 h-12 rounded-full ${s.c} flex items-center justify-center text-xl`}><i className={`fa-solid ${s.i}`}></i></div>
                            <div>
                                <div className="text-sm font-bold text-gray-500">{s.t}</div>
                                <div className="text-2xl font-black text-gray-800">{s.v}</div>
                            </div>
                        </Card>
                    ))}
                </div>

                <Card className="overflow-hidden">
                    <div className="p-6 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <h2 className="text-lg font-bold text-earth-dark">Daftar Siswa & Pemetaan (Simulasi)</h2>
                        <input type="text" placeholder="Cari siswa..." className="px-4 py-2 rounded-full border border-gray-200 text-sm w-64 focus:outline-none focus:border-leaf" />
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-white border-b border-gray-100 text-sm text-gray-500">
                                    <th className="p-4 font-bold">Nama Siswa</th>
                                    <th className="p-4 font-bold text-center">Progress</th>
                                    <th className="p-4 font-bold text-center">Partisipasi Project</th>
                                    <th className="p-4 font-bold text-center">Kebutuhan Khusus</th>
                                    <th className="p-4 font-bold text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="text-sm">
                                {[
                                    { name: "Aisyah", prog: 50, part: "Tinggi", need: "Visual", warn: false },
                                    { name: "Budi", prog: 30, part: "Rendah", need: "Pendampingan Ekstra", warn: true },
                                    { name: "Candra", prog: 80, part: "Sangat Tinggi", need: "Kinestetik", warn: false },
                                    { name: "Dina", prog: 45, part: "Sedang", need: "Audio", warn: false },
                                    { name: "Eko (ABK)", prog: 20, part: "Sedang", need: "Instruksi Sederhana", warn: true }
                                ].map((s, i) => (
                                    <tr key={i} className="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                                        <td className="p-4 font-semibold text-gray-800 flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full bg-beige flex items-center justify-center text-xs text-earth-dark">{s.name.charAt(0)}</div>
                                            {s.name}
                                        </td>
                                        <td className="p-4">
                                            <div className="w-full bg-gray-200 rounded-full h-1.5 max-w-[100px] mx-auto">
                                                <div className={`h-1.5 rounded-full ${s.warn ? 'bg-orange-400' : 'bg-leaf'}`} style={{ width: `${s.prog}%` }}></div>
                                            </div>
                                        </td>
                                        <td className="p-4 text-center">
                                            <span className={`px-2 py-1 rounded text-xs font-bold ${s.part.includes('Tinggi') ? 'bg-green-100 text-green-700' : s.part === 'Rendah' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>{s.part}</span>
                                        </td>
                                        <td className="p-4 text-center text-gray-600">
                                            {s.need}
                                            {s.warn && <i className="fa-solid fa-triangle-exclamation text-orange-500 ml-2" title="Perlu Perhatian"></i>}
                                        </td>
                                        <td className="p-4 text-center">
                                            <button className="text-earth hover:text-earth-dark p-2 bg-beige/20 rounded-lg transition-colors"><i className="fa-solid fa-chart-pie"></i> Detail</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </Card>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('Beranda');

            // Scroll to top on tab change
            useEffect(() => { window.scrollTo(0, 0); }, [activeTab]);

            const renderContent = () => {
                switch(activeTab) {
                    case 'Beranda': return <Home setActiveTab={setActiveTab} />;
                    case 'Tentang': return <About />;
                    case 'Modul': return <Modules />;
                    case 'Project': return <Project />;
                    case 'Game': return <Game />;
                    case 'Galeri': return <Gallery />;
                    case 'Implementasi': return <Implementation />;
                    case 'DashboardSiswa': return <DashboardSiswa />;
                    case 'DashboardGuru': return <DashboardGuru />;
                    default: return <Home setActiveTab={setActiveTab} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />
                    <main className="flex-grow">
                        {renderContent()}
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
